# Optional hardware diagnostic only. No model service/weights are configured in A01.
# docker compose -f compose.yaml -f compose.gpu.yaml --profile gpu-check run --rm gpu-check
services:
  gpu-check:
    image: python:3.12.13-slim-bookworm@sha256:4766d8b510c428e595d74b9cc5bbb2fae8e26316fffb4adc89908d79aacd58a2
    profiles: [gpu-check]
    gpus: all
    network_mode: none
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command: [nvidia-smi, "--query-gpu=name,memory.total,driver_version", "--format=csv,noheader"]
