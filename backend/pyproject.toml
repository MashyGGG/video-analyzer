[project]
name = "video-analyzer-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.162.0", "uvicorn==0.54.0", "sqlalchemy==2.1.8", "alembic==1.20.1", "psycopg[binary]==3.3.7",
  "redis==8.1.0", "celery[redis]==5.6.3", "pydantic-settings==2.16.2",
]

[dependency-groups]
dev = ["pytest==9.2.0", "httpx==0.28.1", "ruff==0.17.3", "mypy==2.4.1", "pyyaml==6.0.3", "types-PyYAML==6.0.12.20261103"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
files = ["app", "migrations"]
