name: Frontend and A01 E2E

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  frontend-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.1'
      - name: Install locked dependencies and browser
        working-directory: frontend
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Frontend quality gate (production build, desktop/mobile, proxy contracts)
        working-directory: frontend
        run: npm run verify
      - name: Real isolated A01 and browser acceptance
        run: |
          python3 scripts/init_local.py
          python3 scripts/verify_a01_e2e.py
      - name: Keep reviewed test diagnostics (synthetic status pages only)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-e2e-reports
          path: |
            .artifacts/playwright/
            evidence/A01-e2e/runs/
          retention-days: 7
          if-no-files-found: ignore
